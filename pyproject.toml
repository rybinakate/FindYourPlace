[project]
name = "hello-gis"
version = "0.1.0"
description = "An H3-based GIS portfolio project measuring proximity to everyday amenities in Madrid"
readme = "README.md"
authors = [
    { name = "rybinakate" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.7",
    "contextily>=1.7.1",
    "duckdb==1.5.6",
    "geopandas>=1.2.0",
    "h3>=4,<5",
    "matplotlib>=3.11.2",
    "osmnx>=2.1.1",
    "pyarrow>=26.0.1",
    "pyrosm>=0.29.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shapely>=2.2.0",
    "types-shapely>=2.1.0.20261030",
]

[project.scripts]
hello-gis = "hello_gis.main:main"

[dependency-groups]
dev = ["mypy>=2.4,<3", "pytest>=9,<10", "ruff>=0.17,<0.18"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
