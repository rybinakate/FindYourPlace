name: Offline GIS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJ_NETWORK: "OFF"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --python "$(command -v python)"
      - name: Run lint, format checks, and pytest offline
        env:
          UV_OFFLINE: "1"
          UV_NO_SYNC: "1"
        run: make check
